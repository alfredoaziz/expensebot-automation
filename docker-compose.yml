services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    security_opt:
      - no-new-privileges:true
    # Uncomment to publish the API on the host too (handy for testing with
    # curl, not required for the bot itself — it reaches Ollama over the
    # internal Docker network at http://ollama:11434).
    # ports:
    #   - "11434:11434"
    #
    # NVIDIA GPU passthrough (needs an up-to-date NVIDIA driver on the
    # Windows host; Docker Desktop's WSL2 backend passes it through
    # automatically). Remove this block to fall back to CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  expensebot:
    build: .
    container_name: expensebot
    restart: unless-stopped
    depends_on:
      - ollama
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials:ro
      # Remembers which bank emails were already reported (V2 Gmail).
      - expensebot_data:/app/data
    security_opt:
      - no-new-privileges:true

volumes:
  ollama_data:
  expensebot_data:
